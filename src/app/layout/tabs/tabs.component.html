<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="wallet">
      <ion-icon aria-hidden="true" name="wallet-outline"></ion-icon>
      <ion-label>Wallet</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="startScan($event)" class="camera-tab-button" aria-label="Scan QR Code">
      <ion-icon aria-hidden="true" name="camera-outline" class="camera-icon"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="settings">
      <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
